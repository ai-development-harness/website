name: Fix prefetch hints

on:
  push:
    branches:
      - feat/dynamic-latest-release
    paths:
      - scripts/fix-prefetch.mjs
      - .github/workflows/fix-prefetch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/dynamic-latest-release

      - name: Fix prefetch markup
        run: node scripts/fix-prefetch.mjs

      - name: Commit transformed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf: привести prefetch к актуальной спецификации"
          git push origin HEAD:feat/dynamic-latest-release
